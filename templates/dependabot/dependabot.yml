# Breeze On Dependabot template — baseline for <repo>/.github/dependabot.yml
# Standard: docs/security-governance.md · templates/dependabot/README.md
# Products MAY extend (e.g. ignore rules with owner/reason). Do not wipe extensions on refresh.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Example extension (commented — enable in product repos when justified):
    # ignore:
    #   - dependency-name: "dotnet-ef"
    #     update-types: ["version-update:semver-major"]
    #   # Owner: …; reason: …

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
