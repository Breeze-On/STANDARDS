# Breeze On Dependabot template — copy to <repo>/.github/dependabot.yml
# Standard: docs/security-governance.md
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
