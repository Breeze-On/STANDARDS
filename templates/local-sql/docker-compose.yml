# Breeze On — local SQL Server sandbox
# Copy to application repo root. See STANDARDS docs/local-database.md
# Requires a gitignored .env with MSSQL_SA_PASSWORD (see .env.example).
# Prefer env_file so `$` in the password is not re-interpolated by Compose.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: breezeon-sql-local
    env_file:
      - .env
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - breezeon-sql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

volumes:
  breezeon-sql-data:
